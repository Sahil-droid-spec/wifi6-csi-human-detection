<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fi CSI research workflow</title><desc id="desc">Recorded CSI data and configuration metadata flow through preprocessing and DSP feature extraction, model experiments, held-out capture and domain evaluation, then results and future application interface.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#112b3b"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6ee7f9"/></marker></defs>
<rect width="1100" height="300" rx="24" fill="url(#bg)"/>
<text x="44" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Research workflow</text>
<text x="44" y="68" font-family="Arial,sans-serif" font-size="12" fill="#9fb4c8">Implemented analysis steps and separately labelled experimental / planned stages</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="38" y="103" width="177" height="120" rx="15" fill="#17283c" stroke="#3b82a0"/><text x="126" y="137" font-size="15" font-weight="700" fill="#e2f6ff">1 · CSI data</text><text x="126" y="162" font-size="12" fill="#b9cbdb">20 / 40 MHz</text><text x="126" y="181" font-size="12" fill="#b9cbdb">MAT / PCAP audit</text><text x="126" y="200" font-size="11" fill="#6ee7f9">Recorded datasets</text>
<rect x="250" y="103" width="177" height="120" rx="15" fill="#17283c" stroke="#3b82a0"/><text x="338" y="137" font-size="15" font-weight="700" fill="#e2f6ff">2 · DSP</text><text x="338" y="162" font-size="12" fill="#b9cbdb">Amplitude / windows</text><text x="338" y="181" font-size="12" fill="#b9cbdb">FIR / DFT / features</text><text x="338" y="200" font-size="11" fill="#6ee7f9">Signal processing</text>
<rect x="462" y="103" width="177" height="120" rx="15" fill="#17283c" stroke="#3b82a0"/><text x="550" y="137" font-size="15" font-weight="700" fill="#e2f6ff">3 · Soft computing</text><text x="550" y="162" font-size="12" fill="#b9cbdb">LR / Random Forest</text><text x="550" y="181" font-size="12" fill="#b9cbdb">GA / fuzzy / hybrid</text><text x="550" y="200" font-size="11" fill="#6ee7f9">Exploratory models</text>
<rect x="674" y="103" width="177" height="120" rx="15" fill="#17283c" stroke="#3b82a0"/><text x="762" y="137" font-size="15" font-weight="700" fill="#e2f6ff">4 · Evaluation</text><text x="762" y="162" font-size="12" fill="#b9cbdb">Capture/date holdout</text><text x="762" y="181" font-size="12" fill="#b9cbdb">LOS / NLOS transfer</text><text x="762" y="200" font-size="11" fill="#fbbf24">Generalization varies</text>
<rect x="886" y="103" width="177" height="120" rx="15" fill="#17283c" stroke="#2dd4bf"/><text x="974" y="137" font-size="15" font-weight="700" fill="#e2f6ff">5 · Reporting</text><text x="974" y="162" font-size="12" fill="#b9cbdb">Metrics + limitations</text><text x="974" y="181" font-size="12" fill="#b9cbdb">AX / BF simulator</text><text x="974" y="200" font-size="11" fill="#5eead4">UI/UX planned next</text>
</g>
<g stroke="#6ee7f9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M215 163 H246"/><path d="M427 163 H458"/><path d="M639 163 H670"/><path d="M851 163 H882"/></g>
<rect x="38" y="247" width="1025" height="28" rx="10" fill="#102c3b"/><rect x="38" y="247" width="5" height="28" rx="2" fill="url(#accent)"/><text x="54" y="265" font-family="Arial,sans-serif" font-size="12" fill="#c6e7f2">Evidence rule: simulator sensing-report counters are not human-detection accuracy; real hardware / through-wall performance is not established.</text>
</svg>
