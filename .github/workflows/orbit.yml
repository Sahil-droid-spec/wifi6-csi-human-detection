name: Orbit checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-app-dev.txt
      - run: python -m pip install -r requirements-app-dev.txt
      - run: python -m ruff check orbit tests tools desktop.py build_desktop.py launch_orbit.py
      - run: python -m pytest tests -q
        env:
          ORBIT_DISABLE_MDNS: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - run: python tools/prepare_offline.py
      - run: python launch_orbit.py --offline --check-install
