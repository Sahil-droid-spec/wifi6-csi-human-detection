<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Orbit</title>
  <link rel="stylesheet" href="./phone.css">
  <script src="./phone.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">Orbit Ultimate 4.1</p>
    <h1>Connect to your laptop</h1>
    <p>This page came directly from the laptop. Choose how to open the shared workspace.</p>
    <a id="app" hidden>Open in the Orbit APK</a>
    <button type="button" id="browser" hidden>Continue in this browser</button>
    <p id="message" role="status"></p>
    <p class="note">Choose one. The pairing QR can be used once. To switch devices or browsers, create a fresh QR on the laptop.</p>
  </main>
</body>
</html>
